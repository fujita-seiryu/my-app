<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#121316" />
<title>移動ドピッチトレーナー</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">

  <!-- 購入者用ロック画面: 合言葉を入力するまでアプリを利用できない -->
  <div id="lockOverlay" class="lock-overlay">
    <div class="lock-box">
      <p class="lock-title">🔒 合言葉を入力してください</p>
      <input type="text" id="lockCodeInput" class="lock-input" placeholder="合言葉" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <button id="lockSubmitBtn" class="lock-submit-btn" type="button">解除</button>
      <p id="lockError" class="lock-error"></p>
    </div>
  </div>

  <!-- 上部: 音名・オクターブ層 設定 -->
  <header class="settings">
    <div class="setting-item">
      <label for="baseNote">音名</label>
      <select id="baseNote"></select>
    </div>
    <div class="setting-item">
      <label for="octaveLayer">オクターブ</label>
      <select id="octaveLayer"></select>
    </div>
  </header>

  <!-- 詳細設定: 検出感度・再生音量（端末ごとに調整して保存） -->
  <div class="adv-settings">
    <button id="advSettingsToggle" class="adv-settings-toggle" type="button">⚙ 詳細設定</button>
    <div id="advSettingsPanel" class="adv-settings-panel hidden">
      <div class="adv-row">
        <label for="sensitivitySlider">検出感度</label>
        <input type="range" id="sensitivitySlider" min="1" max="10" value="6" step="1" />
        <span id="sensitivityValue" class="adv-value">6</span>
      </div>
      <div class="adv-row">
        <label for="volumeSlider">再生音量</label>
        <input type="range" id="volumeSlider" min="0" max="100" value="30" step="5" />
        <span id="volumeValue" class="adv-value">30%</span>
      </div>
    </div>
  </div>

  <!-- マイク開始前オーバーレイ -->
  <div id="micOverlay" class="mic-overlay">
    <button id="micStartBtn" class="mic-start-btn">🎤 マイクを開始</button>
    <p class="mic-hint">タップしてマイクへのアクセスを許可してください</p>
  </div>

  <!-- メイン: 実機VT-12のシール配置を再現した9分割音名リング + フラット/シャープ矢印 -->
  <main class="tuner">
    <div id="noteRing" class="note-ring">
      <div class="ring-center">
        <div class="arrow-row">
          <span id="flatArrow" class="arrow flat">♭ ◀</span>
          <span id="sharpArrow" class="arrow sharp">▶ #</span>
        </div>
        <div class="center-readout">
          <div id="noteName" class="note-name">‐</div>
          <div class="sub-readout">
            <span id="centValue">0¢</span>
            <span class="dot-sep">・</span>
            <span id="freqValue">0.0Hz</span>
          </div>
        </div>
      </div>
      <!-- 9分割の階名リングボタンは script.js が動的生成 -->
    </div>

    <div class="mic-level-row">
      <div class="mic-level-track"><div id="micLevelBar" class="mic-level-bar"></div></div>
    </div>
  </main>

  <!-- 下部: メトロノーム -->
  <footer class="metronome">
    <div class="metro-row">
      <label for="bpmInput">拍速</label>
      <input type="range" id="bpmSlider" min="40" max="240" value="92" step="1" />
      <input type="number" id="bpmInput" min="40" max="240" value="92" step="1" />
    </div>
    <div class="metro-row beat-row">
      <div id="beatDots" class="beat-dots"></div>
    </div>
    <button id="metroToggle" class="metro-toggle">開始</button>
  </footer>

</div>
<script src="script.js"></script>
</body>
</html>
